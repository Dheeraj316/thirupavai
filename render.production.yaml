# Render Blueprint — the REAL SHOP (SMS sign-in, Razorpay payments). Only create this after staging has passed the checks in GO-LIVE.md.
# Create it in Render: New > Blueprint > this repository > Blueprint file path: render.production.yaml
# Render asks for every value marked sync:false when the Blueprint is created. The server refuses to start if any required one is missing.
databases:
  - name: thirupavai-db
    region: singapore
    plan: 1c-2g                       # raise as orders grow; storage can grow, not shrink
    postgresMajorVersion: "17"
    diskSizeGB: 20
    ipAllowList: []

services:
  - type: keyvalue
    name: thirupavai-kv
    region: singapore
    plan: 1g
    maxmemoryPolicy: volatile-lru
    ipAllowList: []

  - type: web
    name: thirupavai
    runtime: docker
    region: singapore
    plan: 2c-4g
    numInstances: 3                   # three instances: one can be replaced or fail without a customer noticing. Scale up before a sale (see GO-LIVE.md).
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: off            # production changes go live when YOU press Deploy, after staging has been checked
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        sync: false                   # e.g. https://www.thirupavai.in  (the real domain)
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: thirupavai-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: thirupavai-kv, property: connectionString }
      - key: WEB_CONCURRENCY          # one process per CPU core of the plan (2c-4g -> 2)
        value: "2"
      - key: PG_POOL_MAX              # 3 instances x 2 processes x 10 = 60 connections; keep this under the database's limit
        value: "10"
      - key: SEED_ADMIN_MOBILE
        sync: false
      - key: OTP_MODE
        value: sms
      - key: MSG91_AUTHKEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MSG91_SENDER
        value: THIRPV
      - key: PAYMENTS_MODE
        value: razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: GSTIN
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_PHONE
        sync: false
