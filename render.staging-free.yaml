# Render Blueprint — STAGING on Render's FREE plans (acceptance checks only; NOT for the 10,000-user load test).
# Same app, same switches as render.yaml: test sign-in codes shown on screen, fake payment gateway, nothing real is charged or texted.
# Create it in Render: New > Blueprint > this repository > Blueprint file path: render.staging-free.yaml
# Free-plan limits: the web server sleeps after ~15 min idle (the next visit takes about a minute to wake it), 512 MB RAM, 0.1 CPU;
# the free Postgres expires 30 days after creation; the free key-value store holds 25 MB and is not saved to disk.
databases:
  - name: thirupavai-staging-db
    region: singapore
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []                   # reachable only from your other Render services

services:
  - type: keyvalue                    # sessions, sign-in codes and rate limits
    name: thirupavai-staging-kv
    region: singapore
    plan: free
    maxmemoryPolicy: volatile-lru
    ipAllowList: []

  - type: web
    name: thirupavai-staging          # the address will be https://thirupavai-staging.onrender.com  (it contains "staging", which the server requires for test mode)
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        value: https://thirupavai-staging.onrender.com
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: thirupavai-staging-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: thirupavai-staging-kv, property: connectionString }
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PG_POOL_MAX
        value: "10"
      - key: SEED_ADMIN_MOBILE         # asked once, when the Blueprint is created: the mobile number of the first Super Admin
        sync: false
      # --- staging switches (the server refuses these on any address that does not contain "staging")
      - key: OTP_MODE
        value: demo
      - key: ALLOW_DEMO_OTP
        value: "1"
      - key: PAYMENTS_MODE
        value: mock
      - key: ALLOW_MOCK_PAYMENTS
        value: "1"
      - key: BUSINESS_NAME
        value: Thirupavai (staging)
