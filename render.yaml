# Render Blueprint — STAGING site (test sign-in codes shown on screen, fake payment gateway, nothing real is charged or texted).
# Create it in Render: New > Blueprint > pick this repository. Render builds ./Dockerfile and creates the database and the key-value store.
# When staging looks right, create the real shop from render.production.yaml (see GO-LIVE.md). Plan names were checked against Render's Blueprint spec.
databases:
  - name: thirupavai-staging-db
    region: singapore                 # closest Render region to India; cannot be changed later
    plan: 0.5c-1g
    postgresMajorVersion: "17"
    diskSizeGB: 10
    ipAllowList: []                   # reachable only from your other Render services

services:
  - type: keyvalue                    # sessions, sign-in codes and rate limits (shared by every instance)
    name: thirupavai-staging-kv
    region: singapore
    plan: 256mb
    maxmemoryPolicy: volatile-lru     # every key we store expires, so only old keys are ever dropped under memory pressure
    ipAllowList: []

  - type: web
    name: thirupavai-staging          # the address will be https://thirupavai-staging.onrender.com  (it contains "staging", which the server requires for test mode)
    runtime: docker
    region: singapore
    plan: 1c-2g
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        value: https://thirupavai-staging.onrender.com
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: thirupavai-staging-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: thirupavai-staging-kv, property: connectionString }
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PG_POOL_MAX
        value: "10"
      - key: SEED_ADMIN_MOBILE         # asked once, when the Blueprint is created: the mobile number of the first Super Admin
        sync: false
      # --- staging switches (the server refuses these on any address that does not contain "staging")
      - key: OTP_MODE
        value: demo
      - key: ALLOW_DEMO_OTP
        value: "1"
      - key: PAYMENTS_MODE
        value: mock
      - key: ALLOW_MOCK_PAYMENTS
        value: "1"
      - key: BUSINESS_NAME
        value: Thirupavai (staging)
